<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Fond turquoise (couleur de la bannière du logo Monétique) -->
  <rect width="64" height="64" rx="14" fill="#1c8cad"/>
  <!-- « m » blanc, rappel du logotype monétique -->
  <text x="32" y="34" text-anchor="middle" dominant-baseline="central"
        font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="40"
        fill="#ffffff">m</text>
  <!-- Accent gris (clin d'œil au « é » de monétique) -->
  <rect x="39" y="12" width="10" height="4" rx="2" transform="rotate(-20 44 14)" fill="#516170"/>
</svg>
