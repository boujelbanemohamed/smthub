# ---------------------------------------------------------------------------
# Configuration nginx pour SMT HUB (reverse proxy HTTPS vers Next.js:4000)
#
# Installation :
#   sudo cp deploy/nginx-smt-hub.conf /etc/nginx/sites-available/smt-hub
#   sudo ln -s /etc/nginx/sites-available/smt-hub /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Remplacez `smt-hub.mondomaine.tn` par votre domaine réel, et les chemins de
# certificat si vous n'utilisez pas Let's Encrypt/certbot.
# ---------------------------------------------------------------------------

# Redirige tout le trafic HTTP vers HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name smt-hub.mondomaine.tn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name smt-hub.mondomaine.tn;

    # --- Certificats TLS (exemple Let's Encrypt / certbot) ---
    ssl_certificate     /etc/letsencrypt/live/smt-hub.mondomaine.tn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smt-hub.mondomaine.tn/privkey.pem;

    # --- Durcissement TLS ---
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS : force HTTPS pendant 1 an (à activer une fois HTTPS confirmé stable)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Taille max des envois : les dépôts de code peuvent aller jusqu'à ~50 Mo.
    # On laisse une marge (60m) pour l'encodage multipart.
    client_max_body_size 60m;

    # --- Compression gzip ---
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;

    # --- Cache long pour les assets statiques précompilés de Next.js ---
    location /_next/static/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # --- Tout le reste vers l'application Next.js ---
    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
    }
}
